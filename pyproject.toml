[project]
name = "memovich"
version = "0.0.1"
description = "AI Memory System"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "David Helkowski"},
]
keywords = [
    "ai", "memory", "llm", "rag", "postgres", "pgvector", "mcp",
    "vector-database", "claude", "chatgpt", "embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0,<7",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.3,<0.4",
    "fastembed>=0.3.0,<0.5",
]

[project.urls]
Homepage = "https://github.com/dryark/memovich"
Repository = "https://github.com/dryark/memovich"
"Bug Tracker" = "https://github.com/dryark/memovich/issues"

[project.scripts]
memovich = "memovich:main"

[project.optional-dependencies]
chroma = ["chromadb>=0.5.0,<0.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0", "psutil>=5.9", "chromadb>=0.5.0,<0.7"]
spellcheck = ["autocorrect>=2.0"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0", "psutil>=5.9", "chromadb>=0.5.0,<0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memovich"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not benchmark and not slow and not stress'"
markers = [
    "benchmark: scale/performance benchmark tests",
    "slow: tests that take more than 30 seconds",
    "stress: destructive scale tests (100K+ drawers)",
]

[tool.coverage.run]
source = ["memovich"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
